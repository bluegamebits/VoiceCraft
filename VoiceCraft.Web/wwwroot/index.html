<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VoiceCraft Web</title>
  <style>
    :root { color-scheme: light dark; --bg: #f5f6f8; --card: #fff; --text: #1b1f24; --muted: #5f6b76; --accent: #2e7d32; --border: #d9dee3; }
    @media (prefers-color-scheme: dark) { :root { --bg: #121417; --card: #1c2025; --text: #e7eaee; --muted: #9aa5b1; --accent: #66bb6a; --border: #2d333a; } }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 560px; margin: 0 auto; padding: 32px 16px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
    h1 { margin: 0 0 4px; font-size: 1.6rem; }
    .muted { color: var(--muted); }
    button { font: inherit; font-weight: 700; border-radius: 8px; border: 1px solid var(--border); padding: 10px 16px; cursor: pointer; background: var(--card); color: var(--text); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .key { font: 700 2rem ui-monospace, monospace; letter-spacing: .05em; }
    meter { width: 100%; }
    ul { padding-left: 20px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  </style>
</head>
<body>
<main>
  <h1>VoiceCraft Web</h1>
  <p class="muted">Proximity voice chat in your browser. No app needed.</p>

  <div class="card">
    <p id="status">Not connected.</p>
    <div class="row">
      <button class="primary" id="start">Connect</button>
      <button id="stop" hidden>Disconnect</button>
      <button id="mute" hidden>Mute</button>
    </div>
  </div>

  <div class="card" id="bind" hidden>
    <p>In Minecraft chat, type:</p>
    <p class="key" id="command"></p>
    <p class="muted">You get a new key every time you connect.</p>
  </div>

  <div class="card" id="live" hidden>
    <p id="bound"></p>
    <label>Microphone <meter id="level" min="0" max="0.3" value="0"></meter></label>
    <p class="muted">Nearby: <span id="peers">nobody</span></p>
  </div>
</main>
<script type="module">
  import { VoiceCraftWeb } from './voicecraft-web.js';

  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const url = new URL('ws', location.href);
  url.protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const options = { url: url.href };
  if (params.has('tone')) {
    // Testing aid: send a 440 Hz tone instead of the microphone.
    options.stream = (ctx) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      gain.gain.value = 0.2;
      const dest = ctx.createMediaStreamDestination();
      osc.connect(gain).connect(dest);
      osc.start();
      return dest.stream;
    };
  }
  if (params.get('codec')) options.codec = params.get('codec');
  const vc = new VoiceCraftWeb(options);
  window.vc = vc;

  const labels = { starting: 'Starting…', connecting: 'Connecting…', connected: 'Connected.', reconnecting: 'Reconnecting…', stopped: 'Not connected.' };
  vc.addEventListener('state', (e) => {
    const { state, reason } = e.detail;
    $('status').textContent = (labels[state] || state) + (reason && state !== 'connected' ? ` (${reason})` : '');
    const on = !['idle', 'stopped'].includes(state);
    $('start').hidden = on; $('stop').hidden = !on; $('mute').hidden = !on;
    if (!on) { $('bind').hidden = true; $('live').hidden = true; }
  });
  vc.addEventListener('bindingkey', (e) => {
    $('command').textContent = `/vcbind ${e.detail.key}`;
    $('bind').hidden = false; $('live').hidden = false;
    $('bound').textContent = e.detail.linkedName
      ? `This device is linked to ${e.detail.linkedName}: it connects by itself when they join.`
      : 'Not linked to a player yet.';
  });
  vc.addEventListener('bound', (e) => {
    $('bind').hidden = true; $('live').hidden = false; $('bound').textContent = `Linked to ${e.detail.name}.`;
  });
  vc.addEventListener('level', (e) => { $('level').value = e.detail.rms; });
  vc.addEventListener('peers', (e) => {
    const list = e.detail.list.map((p) => (p.speaking ? '🔊 ' : '') + p.name);
    $('peers').textContent = list.length ? list.join(', ') : 'nobody';
  });
  $('start').onclick = () => vc.start().catch((err) => { $('status').textContent = `Could not start: ${err.message || err}`; });
  $('stop').onclick = () => vc.stop();
  $('mute').onclick = () => { vc.setMuted(!vc.muted); $('mute').textContent = vc.muted ? 'Unmute' : 'Mute'; };
</script>
</body>
</html>
